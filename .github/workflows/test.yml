name: CI

on:
  push:
    # paths フィルタは付けない (auth-worker と同形)。GitHub Actions は tag push
    # でも paths を評価するため、web/ を変更しない `v*` tag リリースで
    # deploy-release / no-traffic upload / traffic-report が発火しなくなるのを防ぐ。
    branches: [main]
    tags: ['v*']
  pull_request:
    # ★★ ここに paths フィルタを **置かない**。復活させるなら、先に下の
    # 「required check の扱い」を解くこと (解かずに戻すと必ずデッドロックする)。
    #
    # (1) paths フィルタと required status checks は両立しない。
    #     main の required checks は `ci / Vitest + Coverage` と `ci / PR Limit Check`
    #     の 2 本 (branch protection に文字列で刻まれている)。paths に当たらない PR では
    #     workflow が 1 度も起動しないので、この 2 本が永遠に報告されない。GitHub は
    #     それを「まだ来ていない」と扱うため、PR は mergeStateStatus: BLOCKED のまま
    #     永久に詰む (管理者バイパス必須)。
    #
    # (2) この repo は 4 回踏んだ。
    #       1. signaling-only の PR        → cf-alc-signaling/** を追加
    #       2. plan/** のみの PR (#92)     → plan/** を追加 (Refs #93)
    #       3. docs/** のみの PR (#165)    → docs/** を追加 (Refs #167)
    #       4. .gitignore のみの PR (#281) → .gitignore を追加
    #     毎回「足りない要素を足す」症状対処をしてきたが、**発生源は「足りない要素」では
    #     なく「フィルタが在ること」そのもの**だった。実際 5 回目の候補は今も root 直下に
    #     ある (CLAUDE.md / mkdocs.yml / scripts/** / .githooks/** / .github/ の
    #     workflows 以外 / requirements-docs.txt はどれも旧 paths に当たらない)。
    #     列挙で追いつく問題ではないのでフィルタごと捨て、「PR では必ず起動する」に倒した
    #     (足し忘れが「詰み」ではなく「余計に走るだけ」になる向き)。
    #     なお過去 3 回の対処 (plan/** docs/** cf-alc-*/**) は無効化していない —
    #     フィルタ無しはそれらの上位集合で、同じ PR は従来どおり起動する。
    #
    # (3) 削除しても run は増えない (実測)。main の first-parent 108 commit のうち、
    #     旧 paths に一切当たらないものは 0 件 = この削除で新たに走る run は 0。
    #     加えて上の push: branches:[main] は元から paths 無しで、全 merge に full CI を
    #     走らせている。PR 側だけ絞っても節約はほぼ無かった。
    #
    # (4) 「起動はさせるが job 側で早期 skip」も解にならない。required check 名は
    #     reusable workflow (ippoan/ci-workflows/.github/workflows/frontend-ci.yml) の
    #     **内側 job 名** (test: = Vitest + Coverage / pr-limit: = PR Limit Check) で、
    #     caller の `ci` job を if: で skip すると内側 job が 1 本も check を作らず、
    #     (1) と同じデッドロックを別の形で作る。
    branches: [main]

permissions:
  contents: write
  packages: read
  pull-requests: write
  id-token: write   # frontend-ci.yml 内蔵の secret-verify job が要求 (未宣言だと
                    # gcp_secret_verify_* を渡さない caller でも startup_failure)

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      working_directory: web
      # 内蔵 secret-verify job は wrangler 設定を repo root で autodetect する
      # (working_directory を見ない)。本 repo の wrangler.jsonc は web/ 配下
      # なので明示 path を渡さないと "wrangler config not found" で落ちる。
      # secrets.required は [] なので verify は 0 件で trivial pass。
      gcp_secret_verify_wrangler_path: 'web/wrangler.jsonc'
      # staging build に export/import 用 key を焼く (rust-alc-api#391 opt-in 認証)。
      # org secret ALC_STAGING_API_KEY → NUXT_PUBLIC_STAGING_API_KEY。client bundle に
      # 入る公開値モデル (staging ページ閲覧者 = key を知る人) は issue #391 前提のとおり
      staging_build_secret_name: 'ALC_STAGING_API_KEY'
      staging_build_env_name: 'NUXT_PUBLIC_STAGING_API_KEY'
      install_command: 'npm install'
      has_integration: true
      # integration test は rust-alc-api コンテナ (docker-compose.test.yml の
      # api サービス) を相手に走る。Release Wave の frontend↔backend
      # compatibility edge を記録するため backend repo と image env を配線する。
      # compat machinery が test 前に backend SHA を解決し
      # API_IMAGE=ghcr.io/ippoan/rust-alc-api:<sha> を export して、その image で
      # integration を回す (truthful 突合)。docker-compose は ${API_IMAGE} を読む。
      compat_backend_repo: 'ippoan/rust-alc-api'
      compat_backend_image_env: 'API_IMAGE'
      use_auth_client_dev: true
      pre_install_script: |
        mkdir -p ../fc1200-wasm/pkg
        echo '{"name":"fc1200-wasm","version":"0.0.0","main":"index.js","types":"index.d.ts"}' > ../fc1200-wasm/pkg/package.json
        echo 'module.exports = {}' > ../fc1200-wasm/pkg/index.js
        if [ -f app/types/fc1200-wasm.d.ts ]; then
          cp app/types/fc1200-wasm.d.ts ../fc1200-wasm/pkg/index.d.ts
        fi
      integration_test_command: 'npx vitest run tests/utils/api.test.ts'
      integration_env: 'TEST_LIVE=1 API_BASE_URL=http://localhost:18080'
      cache_dependency_path: web/package-lock.json
      # Release Wave の deploy 面に乗せる。frontend-ci の deploy-staging (PR) /
      # deploy-release (v* tag) が wrangler deploy 後に version 配分を
      # ci-dashboard /webhooks/release-wave/traffic-report へ報告し、
      # /release-wave の「Traffic (version split)」表に alc-app 行が出る。
      # 手動 `cd web && npm run deploy` (= nuxt build && wrangler deploy) を
      # そのまま CI 化したもの。NUXT_PUBLIC_* は wrangler.jsonc の vars
      # (prod = top-level / staging = env.staging.vars) で runtime 注入され、
      # nitro preset も nuxt.config で cloudflare_module 固定なので build 時の
      # env 注入は不要。release_no_traffic=true (default) により release の
      # `wrangler deploy` は `wrangler versions upload` (no-traffic) に置換され、
      # flip は Release Wave / wrangler versions deploy で明示的に 100% へ。
      # VersionBadge (@ippoan/auth-client) 用に稼働版数を注入 (auth-worker / ippoan
      # 統一)。staging は commit SHA、release は tag (ref_name)。NUXT_PUBLIC_APP_VERSION
      # は build 時に runtimeConfig.public.appVersion へ焼き込み、runtime も wrangler
      # --var で上書きする (二重指定で確実に反映)。
      deploy_staging_script: 'NUXT_PUBLIC_APP_VERSION=${{ github.sha }} npm run build && npx wrangler deploy --env staging --var NUXT_PUBLIC_APP_VERSION:${{ github.sha }}'
      deploy_release_script: 'NUXT_PUBLIC_APP_VERSION=${{ github.ref_name }} npm run build && npx wrangler deploy --var NUXT_PUBLIC_APP_VERSION:${{ github.ref_name }}'
    secrets: inherit
