name: Recorder Deploy

# cf-alc-recorder (CoreS3 測定データ WS 受口 worker) の CI (Refs ippoan/alc-app#106)。
#
# signaling-deploy.yml と同じく Durable Object を持つため frontend-ci.yml は使えず
# (release script の `wrangler deploy` → `versions upload` 置換が DO worker と相性が
# 悪い、durable-object-worker skill 参照)、bespoke workflow で real `wrangler deploy`
# を行う。signaling と違い alc-app 標準 (web/wrangler.jsonc) に合わせた 2 面:
#   - main push  → staging (`alc-recorder-staging`)
#   - `v*` tag   → production (`alc-recorder`)
#
# push 側に paths フィルタを付けない理由は test.yml と同じ — GitHub Actions は tag
# push でも paths を評価するため、cf-alc-recorder/ を変更しない `v*` tag リリースで
# production deploy が発火しなくなるのを防ぐ。
#
# 代わりに production job 側で前タグとの tree 比較を行い、中身が変わっていなければ
# deploy を skip する。**空 deploy は無害ではない**: `wrangler deploy` は中身が同じでも
# 対象 Worker の Durable Object を全部再起動し、接続中の WebSocket を全部切る
# (Cloudflare 公式 durable-objects/best-practices/websockets。2021-03-26 の変更履歴に
# 「意図的な設計」と明記)。実測 2026-09-17: 本番 deploy 17 本のうち cf-alc-recorder の
# 中身が変わったのは v0.0.155 (#290) の 1 本だけで、端末の WS 切断 8 件のうち 5 件が
# deploy の run 完了と ±3 秒で一致していた。
#
# 運用ルール: production job が赤いまま次のタグへ進むと、その版が本番に載らない
# (次のタグは赤い run の版と tree 比較して等価になり skip される)。赤い run は rerun すること。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'cf-alc-recorder/**'
      - '.github/workflows/recorder-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-alc-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # wrangler v4 は Node 22+ 必須
          cache: 'npm'
          cache-dependency-path: cf-alc-recorder/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run

  # main push → staging。auth-worker-staging に service binding される (wrangler.toml)。
  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-alc-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cf-alc-recorder/package-lock.json
      - run: npm ci
      - name: Deploy (staging)
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # v* tag → production。中身が前タグから変わっていなければ skip する (冒頭コメント参照)。
  deploy-production:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-alc-recorder
    steps:
      - uses: actions/checkout@v4
        with:
          # 前タグとの tree 比較に全タグが要る (shallow clone には tag が無い)。
          # pack は 11.8 MiB なのでコストは無視できる。test / deploy-staging には付けない。
          fetch-depth: 0
      - name: Detect recorder changes since previous tag
        id: changes
        # defaults.run.working-directory が cf-alc-recorder のままだと pathspec が cwd 相対に
        # なり、比較が常に空振りする (= 何も変わっていない扱い)。repo root で走らせる。
        working-directory: ${{ github.workspace }}
        run: |
          set +e  # ★ GitHub Actions の run: の既定シェルは `bash -e` なので、明示的に errexit を無効化する
          # git diff --quiet は差分ありで rc=1 を返すため、errexit のままだと 1 行目で step が
          # 終了して rc=$? に到達せず、fail-closed (本物の変更が黙って本番に載らない) になる
          # (実測: v0.0.167 の run で production deploy が skipped)。tags= の grep も 0 件マッチで
          # rc=1 を返す同じ穴。git の些細な失敗で job を落とさず、rc で分岐する。
          tag="$GITHUB_REF_NAME"
          # 前タグ = 厳密 vN.N.N のタグを版の降順に並べた 1 つ下。採番側 (ippoan/ci-workflows の
          # tag-release.yml) と同じ走査規則。git describe は shallow で壊れるうえ
          # 「祖先で最寄り」≠「版で隣」なので使わない。
          tags="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          if printf '%s\n' "$tags" | grep -qxF "$tag"; then
            prev="$(printf '%s\n' "$tags" | grep -xF -A1 "$tag" | sed -n '2p')"
          else
            # 現タグが非 semver (suffix 付き) → 最上位の semver タグを前タグとみなす
            prev="$(printf '%s\n' "$tags" | head -n1)"
          fi

          if [ -z "$prev" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::warning::前タグを特定できませんでした (tag=$tag)。fail-open で production deploy を実行します。"
            echo "recorder deploy: **実行** — 前タグを特定できず fail-open (tag=\`$tag\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git diff --quiet "$prev" HEAD -- cf-alc-recorder .github/workflows/recorder-deploy.yml
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "recorder deploy: **skip** — \`$prev\` → \`$tag\` で cf-alc-recorder と本 workflow に変更なし" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -eq 1 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "recorder deploy: **実行** — \`$prev\` → \`$tag\` で cf-alc-recorder / 本 workflow に変更あり" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::warning::git diff が異常終了しました (rc=$rc, prev=$prev, tag=$tag)。fail-open で production deploy を実行します。"
            echo "recorder deploy: **実行** — git diff が rc=$rc で異常終了したため fail-open" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.deploy == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cf-alc-recorder/package-lock.json
      - run: npm ci
        if: steps.changes.outputs.deploy == 'true'
      - name: Deploy (production)
        if: steps.changes.outputs.deploy == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
