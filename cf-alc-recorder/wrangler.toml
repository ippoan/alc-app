# cf-alc-recorder — CoreS3 (alc-app-s3) 測定データの WebSocket 受口 Worker
# (Refs ippoan/alc-app#106)。
#
# 経路: CoreS3 →(WSS + device JWT)→ 本 Worker →(AUTH_WORKER service binding)→
#       auth-worker /alc-internal-proxy → rust-alc-api POST /api/hub/measurements
#
# cf-alc-signaling (単一環境) と違い、alc-app 標準 (web/wrangler.jsonc) に合わせて
# prod (top-level) / staging (env.staging) の 2 面。named env は top-level binding を
# 継承しないので observability / durable_objects / services / secrets_store_secrets を
# env.staging 側でも再宣言する。

name = "alc-recorder"
main = "src/index.ts"
compatibility_date = "2025-07-15"
# mimetext (crash_log メール通知) が Node 組み込み (path / node:os) を参照するため必須
# (security-notification-app と同じ)。compatibility_flags は inheritable key なので
# env.staging にも継承される (bindings と違い再宣言不要)
compatibility_flags = ["nodejs_compat"]
# account_id を明示 (web/wrangler.jsonc / cf-alc-signaling と同値)。未指定だと wrangler が
# /memberships を列挙し、account-scoped な CLOUDFLARE_API_TOKEN では Authentication
# error [code: 10000] で deploy が落ちる (signaling-deploy CI 実測)。
account_id = "24b45709d060d957340180e995f0d373"

[observability]
enabled = true
head_sampling_rate = 1

# CoreS3 電源/バッテリー状態の定期取得 (Refs #121)。prod のみ (staging に実機フリートは無い)。
[triggers]
crons = ["*/30 * * * *"]

# テナント単位の Durable Object (Hibernatable WebSockets)。
[durable_objects]
bindings = [
  { name = "RECORDER_HUB", class_name = "RecorderHub" }
]

# 新規 class は SQLite backend で作る (new_classes は legacy KV backend)。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RecorderHub"]

# WSS ハンドシェイクの device JWT を auth-worker /auth/introspect で検証し、
# 測定データを /alc-internal-proxy に転送するための service binding。
[[services]]
binding = "AUTH_WORKER"
service = "auth-worker"

# /auth/introspect の consumer proof + /alc-internal-proxy の X-Alc-Proxy-Secret
# (web/ の kiosk proxy と同じ CF Secrets Store entry を物理共有)。
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# crash_log (CoreS3 の異常リセット復帰レポート、ippoan/alc-app-s3#43) の保存先。
# backend (rust-alc-api hub_measurements) へは転送せず R2 で完結させる。
# key: {tenant_id}/{device_id}/{seq 12桁0詰}.json (再送冪等)。
# バケットは prod/staging 共用 (tenant_id が別なので衝突しない)。
# 初回 deploy 前に `npx wrangler r2 bucket create alc-crash-logs` が必要。
[[r2_buckets]]
binding = "CRASH_LOGS"
bucket_name = "alc-crash-logs"

# CoreS3 バッテリー snapshot cron (30分おき、Refs #121) の保存先。
# key: {tenant_id}/{device_id}/{取得時刻ms}.json。rust-alc-api hub_measurements は
# 使わない (診断値であって測定データではないため、crash_log と同じ持ち方)。
# 7日で自動削除する Object Lifecycle Rule はバケット側の運用設定でコードでは制御不可 —
# 初回 deploy 前に以下を実行すること:
#   npx wrangler r2 bucket create alc-battery-history
#   npx wrangler r2 bucket lifecycle add alc-battery-history --expire-days 7
[[r2_buckets]]
binding = "BATTERY_HISTORY"
bucket_name = "alc-battery-history"

# crash_log のメール通知 (best-effort。R2 が正、メールは通知のみ)。
# security-notification-app と同じ Email Routing send_email binding 方式 —
# 宛先は検証済み destination address であること。差出人 (NOTIFY_EMAIL_FROM) は
# Email Routing を有効化済みの mtamaramu.com ドメインを使う。
[[send_email]]
name = "CRASH_EMAIL"
destination_address = "m.tama.ramu@gmail.com"

[vars]
NOTIFY_EMAIL_FROM = "alc-crash@mtamaramu.com"
NOTIFY_EMAIL_TO = "m.tama.ramu@gmail.com"

[env.staging]
name = "alc-recorder-staging"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.durable_objects]
bindings = [
  { name = "RECORDER_HUB", class_name = "RecorderHub" }
]

[[env.staging.services]]
binding = "AUTH_WORKER"
service = "auth-worker-staging"

[[env.staging.secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

[[env.staging.r2_buckets]]
binding = "CRASH_LOGS"
bucket_name = "alc-crash-logs"

# staging は cron ([triggers] は top-level のみ) を持たないが、binding 自体は
# 手動 scheduled() 検証用に prod と同じバケットを共有する (tenant_id で衝突しない)。
[[env.staging.r2_buckets]]
binding = "BATTERY_HISTORY"
bucket_name = "alc-battery-history"

[[env.staging.send_email]]
name = "CRASH_EMAIL"
destination_address = "m.tama.ramu@gmail.com"

[env.staging.vars]
NOTIFY_EMAIL_FROM = "alc-crash@mtamaramu.com"
NOTIFY_EMAIL_TO = "m.tama.ramu@gmail.com"
