<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="IT点呼">
  <title>IT点呼</title>
  <!-- maskable 用に全面を violet で塗る (safe zone = 中心 半径 204 の円) -->
