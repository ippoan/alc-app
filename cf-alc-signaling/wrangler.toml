name = "alc-signaling"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# account_id を明示 (web/wrangler.jsonc と同値)。未指定だと wrangler が /memberships を
# 列挙し、account-scoped な CLOUDFLARE_API_TOKEN では Authentication error [code: 10000] で
# deploy が落ちる (CI 実測)。
account_id = "24b45709d060d957340180e995f0d373"

# Workers Logs を有効化 (console.log を永続化し dashboard / cf_logging MCP からクエリ可能にする)
[observability]
enabled = true
head_sampling_rate = 1

[vars]
BACKEND_API_URL = "https://rust-alc-api-566bls5vfq-an.a.run.app"

# cam-room admin (ブラウザ) 接続の Google ログイン JWT を auth-worker /auth/introspect
# で検証するための service binding (cf-alc-recorder/src/auth.ts と同パターン、Refs alc-app#129)。
[[services]]
binding = "AUTH_WORKER"
service = "auth-worker"

# /auth/introspect の consumer proof。cf-alc-recorder / web/ の kiosk proxy と同じ
# CF Secrets Store entry を物理共有 (新規 secret ではない)。
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

[durable_objects]
bindings = [
  { name = "SIGNALING_ROOM", class_name = "SignalingRoom" },
  { name = "ROOM_REGISTRY", class_name = "RoomRegistry" },
  { name = "CAMERA_SIGNALING_ROOM", class_name = "CameraSignalingRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["SignalingRoom"]

[[migrations]]
tag = "v2"
new_classes = ["RoomRegistry"]

[[migrations]]
tag = "v3"
new_classes = ["CameraSignalingRoom"]
